name: greg_van_berkel
description: Greg van Berkel's Professional Journey.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_slick: ^5.4.0
  go_router: ^17.0.0
  google_fonts: ^6.2.1
  flutter_markdown_plus: ^1.0.7
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/cv_content/g21/
    - assets/cv_content/g26/
    - assets/images/
  fonts:
    - family: DroidSerif
      fonts:
        - asset: google_fonts/DroidSerif-Regular.ttf
        - asset: google_fonts/DroidSerif-Italic.ttf
          style: italic
        - asset: google_fonts/DroidSerif-Bold.ttf
          weight: 700
        - asset: google_fonts/DroidSerif-BoldItalic.ttf
          weight: 700
          style: italic
